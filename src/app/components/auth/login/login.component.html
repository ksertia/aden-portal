<div class="login-container">
  <div class="login-card fade-in-up">
    <div class="login-header">
      <div class="logo">
        <svg
          width="48"
          height="48"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M12 2v6l3-3 3 3" />
          <path d="M12 8v8" />
          <path d="m8 14 4 4 4-4" />
        </svg>
      </div>
      <h1>RecouvrePro</h1>
      <p>Connexion à votre espace personnel</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="email">Adresse e-mail</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="credentials.email"
          name="email"
          placeholder="Votre adresse e-mail"
          required
          [disabled]="isLoading"
        />
      </div>

      <div class="form-group password-wrapper">
  <label for="password">Mot de passe</label>

  <input
    [type]="showPassword ? 'text' : 'password'"
    id="password"
    [(ngModel)]="credentials.password"
    name="password"
    placeholder="Votre mot de passe"
    required
    [disabled]="isLoading"
  />

  <!-- Icône œil -->
  <span class="toggle-eye" (click)="showPassword = !showPassword">
    <svg *ngIf="!showPassword" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>

    <svg *ngIf="showPassword" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.87 21.87 0 0 1 5.17-6.88"/>
      <path d="M1 1l22 22"/>
    </svg>
  </span>
</div>

      <!--Lien ajouté ici -->
      <div class="forgot-password">
        <a routerLink="/forgot-password">Mot de passe oublié ?</a>
      </div>
      <!--Fin ajout -->

      <div class="error-message" *ngIf="errorMessage">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="12" cy="12" r="10" />
          <line x1="15" y1="9" x2="9" y2="15" />
          <line x1="9" y1="9" x2="15" y2="15" />
        </svg>
        {{ errorMessage }}
      </div>
      <div class="ch">
        <button routerLink="/accueil" class="cancel-btn">Annuler</button>
        <button type="submit" class="login-btn" [disabled]="isLoading">
          <span *ngIf="!isLoading">Se connecter</span>
          <span *ngIf="isLoading" class="loading">
            <svg
              class="spinner"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M12 2v4m6 2-4 4m4 6-4-4m-6 4v-4m-6-2 4-4m-4-6 4 4" />
            </svg>
            Connexion...
          </span>
        </button>
      </div>
    </form>
  </div>
</div>
