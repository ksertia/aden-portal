<div class="login-container">
  <div class="login-card fade-in-up">
    <div class="login-header">
      <div class="logo">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2v6l3-3 3 3"/>
          <path d="M12 8v8"/>
          <path d="m8 14 4 4 4-4"/>
        </svg>
      </div>
      <h1>RecouvrePro</h1>
      <p>Changement de mot de passe</p>
    </div>

    <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()" *ngIf="!successMessage">
      <!-- Mot de passe actuel -->
      <div class="form-group">
        <label for="currentPassword">Mot de passe actuel</label>
        <input
          [type]="showCurrentPassword ? 'text' : 'password'"
          id="currentPassword"
          formControlName="currentPassword"
          placeholder="Entrez votre mot de passe actuel"
          required
          [disabled]="isSubmitting"
        >
      </div>

      <!-- Nouveau mot de passe -->
      <div class="form-group">
        <label for="password">Nouveau mot de passe</label>
        <input
          [type]="showNewPassword ? 'text' : 'password'"
          id="password"
          formControlName="password"
          placeholder="Entrez votre nouveau mot de passe"
          required
          [disabled]="isSubmitting"
        >
      </div>

      <!-- Confirmation -->
      <div class="form-group">
        <label for="passwordConfirmation">Confirmer le mot de passe</label>
        <input
          [type]="showConfirmPassword ? 'text' : 'password'"
          id="passwordConfirmation"
          formControlName="passwordConfirmation"
          placeholder="Confirmez votre mot de passe"
          required
          [disabled]="isSubmitting"
        >
      </div>

      <!-- Message d’erreur -->
      <div class="error-message" *ngIf="errorMessage">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="15" y1="9" x2="9" y2="15"/>
          <line x1="9" y1="9" x2="15" y2="15"/>
        </svg>
        {{ errorMessage }}
      </div>

      <!-- Bouton -->
      <button type="submit" class="login-btn" [disabled]="isSubmitting || changePasswordForm.invalid">
        <span *ngIf="!isSubmitting">Mettre à jour le mot de passe</span>
        <span *ngIf="isSubmitting" class="loading">
          <svg class="spinner" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2v4m6 2-4 4m4 6-4-4m-6 4v-4m-6-2 4-4m-4-6 4 4"/>
          </svg>
          Mise à jour...
        </span>
      </button>

      <button routerLink="/dashboard" class="cancel-btn">Annuler</button>
    </form>

    <div *ngIf="successMessage" class="demo-note">
      <p>{{ successMessage }}</p>
      <p><a routerLink="/dashboard" class="back-link">Retour au tableau de bord</a></p>
    </div>
  </div>
</div>
