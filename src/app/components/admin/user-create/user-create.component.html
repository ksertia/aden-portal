<div class="user-create-container">
  <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="form-card">
    
    <!-- Prénom + Nom -->
    <div class="form-row">
      <div class="form-group">
        <label for="firstName">Prénom</label>
        <input type="text" id="firstName" formControlName="firstName" placeholder="Votre prénom" required>
      </div>

      <div class="form-group">
        <label for="lastName">Nom</label>
        <input type="text" id="lastName" formControlName="lastName" placeholder="Votre nom" required>
      </div>
    </div>

    <!-- Email + Téléphone -->
    <div class="form-row">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" formControlName="email" placeholder="votre.email@exemple.fr" required>
      </div>

      <div class="form-group">
        <label for="username">Nom d'utilisateur</label>
        <input type="text" id="username" formControlName="username" placeholder="Nom d'utilisateur" required>
      </div>
    </div>

    <!-- Profil -->
    <div class="form-group">
      <label for="role">Profil</label>
      <select id="role" formControlName="role" required>
        <option value="">Sélectionnez votre profil</option>
        <option *ngFor="let role of roles" [value]="role">{{ role }}</option>
      </select>
    </div>

    <button type="submit" [disabled]="!userForm.valid" class="submit-btn">
      Inscrire l'utilisateur
    </button>

    <div *ngIf="successMessage" class="success-message">{{ successMessage }}</div>
    <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
  </form>
</div>
